<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Fact Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #00ff9d;
            --danger: #ff3e3e;
            --success: #00ff9d;
            --border: #222222;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin-top: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }
        
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
        }
        
        .card-header h5 {
            font-weight: 400;
            font-size: 1rem;
            margin: 0;
        }
        
        .form-control {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            background-color: var(--bg-primary);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: none;
        }
        
        .form-control::placeholder {
            color: var(--text-secondary);
        }
        
        .btn-primary {
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 400;
            color: var(--bg-primary);
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: #00cc7d;
            transform: translateY(-1px);
        }
        
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
        }
        
        .real-news {
            border-left: 3px solid var(--success);
        }
        
        .fake-news {
            border-left: 3px solid var(--danger);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
            color: var(--text-secondary);
        }
        
        .loading i {
            font-size: 1.5rem;
            color: var(--accent);
        }
        
        .analysis-section {
            margin-top: 20px;
            padding: 20px;
            background-color: var(--bg-primary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .confidence-meter {
            height: 4px;
            background-color: var(--border);
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .confidence-level {
            height: 100%;
            background-color: var(--accent);
            transition: width 0.8s ease;
        }
        
        .timestamp {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 15px;
        }
        
        .error-message {
            color: var(--danger);
            padding: 12px;
            border-radius: 6px;
            background-color: rgba(255, 62, 62, 0.1);
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }

        .badge {
            font-weight: 400;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .bg-success {
            background-color: var(--success) !important;
            color: var(--bg-primary) !important;
        }

        .bg-danger {
            background-color: var(--danger) !important;
            color: var(--bg-primary) !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>News Fact Checker</h1>
            <p>Analyze Articles • Verify Facts</p>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Enter Article</h5>
                    </div>
                    <div class="card-body">
                        <form id="newsForm">
                            <div class="mb-3">
                                <textarea class="form-control" id="newsText" name="news_text" rows="6" 
                                    placeholder="Paste your news article here..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Analyze
                            </button>
                        </form>
                    </div>
                </div>

                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p class="mt-2">Analyzing...</p>
                </div>

                <div class="error-message" id="errorMessage"></div>

                <div id="resultBox" class="result-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0" style="font-weight: 300;">Analysis</h4>
                        <span id="resultBadge" class="badge"></span>
                    </div>
                    
                    <div class="analysis-section mb-3">
                        <div class="d-flex align-items-center mb-2">
                            <h5 style="font-weight: 300; margin: 0;">AI Detection</h5>
                            <span class="ms-2" style="color: var(--text-secondary); font-size: 0.8rem;">Powered by ML Model</span>
                        </div>
                        <div class="confidence-meter">
                            <div id="confidenceLevel" class="confidence-level"></div>
                        </div>
                        <p class="text-center" id="confidenceText" style="color: var(--text-secondary);"></p>
                    </div>
                    
                    <div class="analysis-section">
                        <div class="d-flex align-items-center mb-2">
                            <h5 style="font-weight: 300; margin: 0;">Fact Check</h5>
                            <span class="ms-2" style="color: var(--text-secondary); font-size: 0.8rem;">Powered by Gemini</span>
                        </div>
                        <div id="geminiAnalysis"></div>
                    </div>
                    
                    <div class="timestamp" id="timestamp"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('newsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const loading = document.querySelector('.loading');
            const resultBox = document.getElementById('resultBox');
            const errorMessage = document.getElementById('errorMessage');
            const confidenceLevel = document.getElementById('confidenceLevel');
            const confidenceText = document.getElementById('confidenceText');
            const resultBadge = document.getElementById('resultBadge');
            const geminiAnalysis = document.getElementById('geminiAnalysis');
            const timestamp = document.getElementById('timestamp');
            
            loading.style.display = 'block';
            resultBox.style.display = 'none';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: document.getElementById('newsText').value
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                resultBox.className = 'result-box ' + (data.is_fake ? 'fake-news' : 'real-news');
                resultBadge.className = 'badge ' + (data.is_fake ? 'bg-danger' : 'bg-success');
                resultBadge.textContent = data.is_fake ? 'Potentially Fake' : 'Likely Real';
                
                confidenceLevel.style.width = `${data.confidence}%`;
                confidenceText.textContent = `Confidence: ${data.confidence}%`;
                
                geminiAnalysis.innerHTML = data.gemini_analysis;
                timestamp.textContent = `Analyzed: ${data.timestamp}`;
                
                resultBox.style.display = 'block';
                
            } catch (error) {
                errorMessage.textContent = 'Error: ' + error.message;
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
